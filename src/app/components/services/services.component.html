<section id="services" class="services">
  <div class="container">
    <div class="section-header animate-on-scroll">
      <h2 class="section-title">Our Services</h2>
      <p class="section-subtitle">
        Exceptional photography experiences tailored to your vision and
        crafted with artistic excellence
      </p>
    </div>

    <div *ngIf="isLoading" class="loading-state">
      <p>Loading services...</p>
    </div>
    <div *ngIf="!isLoading && services.length === 0" class="empty-state">
      <p>No services available at the moment.</p>
    </div>
    <div *ngIf="!isLoading && services.length > 0" class="services-showcase stagger-children">
      <div *ngFor="let service of services" class="service-card">
        <div class="service-visual">
          <app-responsive-image
            [src]="service.url || service.image || ''"
            [alt]="service.title"
            [imageId]="service.id || service._id"
            imageType="service"
            [lazy]="true"
            [sizes]="'(max-width: 768px) 100vw, (max-width: 1200px) 50vw, 33vw'">
          </app-responsive-image>
          <div class="service-overlay"></div>
        </div>
        <div class="service-content">
          <h3>{{ service.title }}</h3>
          <p>{{ service.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
